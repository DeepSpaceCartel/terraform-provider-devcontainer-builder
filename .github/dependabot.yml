version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      terraform-plugin:
        patterns:
          - "github.com/hashicorp/terraform-plugin-*"
  # Bumps the pinned commit SHAs in .github/workflows/ together with their
  # version comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
