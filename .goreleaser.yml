# Standard HashiCorp Terraform-provider release shape (see
# https://developer.hashicorp.com/terraform/registry/providers/publishing) -
# GPG-signed, checksummed binaries for the OS/arch matrix the Registry
# expects, plus the manifest file it needs to know this provider speaks
# protocol 6. Triggered by .github/workflows/release.yaml on a real vX.Y.Z
# tag.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: freebsd
        goarch: arm64
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  # --pinentry-mode loopback: without it gpg tries to spawn an interactive
  # pinentry prompt to unlock the key - even a passphrase-less one - and
  # fails with "Inappropriate ioctl for device" on a CI runner with no
  # terminal (crazy-max/ghaction-import-gpg already enables
  # allow-loopback-pinentry in gpg-agent.conf). The passphrase is the same
  # GPG_PASSPHRASE secret release.yaml imports the key with, fed on stdin
  # (--passphrase-fd 0) rather than argv so it never shows up in a process
  # listing; it's empty for a key without one, which gpg accepts.
  - artifacts: checksum
    stdin: "{{ .Env.GPG_PASSPHRASE }}"
    args:
      - "--batch"
      - "--pinentry-mode"
      - "loopback"
      - "--passphrase-fd"
      - "0"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

changelog:
  disable: true
